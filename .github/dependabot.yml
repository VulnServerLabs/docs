# Dependabot version updates. Pull requests target dev (dev -> main via PR).
# Note: GitHub reads this file from the default branch (main), so it takes effect after dev is merged to main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
